name: Build Alpy Web Windows App

on:
  push:
    branches: [ main ]
    paths:
      - "alpy-web/**"
      - "windows/AlpyWeb/**"
      - "windows/AlpyWebInstaller/**"
      - ".github/workflows/alpy-web-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore windows/AlpyWeb/AlpyWeb.csproj

      - name: Publish portable app
        run: >
          dotnet publish windows/AlpyWeb/AlpyWeb.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o windows/AlpyWeb/publish

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: AlpyWeb-portable
          path: windows/AlpyWeb/publish/**
          if-no-files-found: error

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: powershell
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "windows\AlpyWebInstaller\AlpyWeb.iss"'

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: AlpyWebSetup
          path: dist/AlpyWebSetup.exe
          if-no-files-found: error
