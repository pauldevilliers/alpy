<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b9dceb">
<title>Alpy Web</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="desktop" class="desktop" tabindex="0" aria-label="Alpy Web desktop">
  <div class="desktop-watermark">ALPY WEB</div>

  <div id="windows" class="windows" aria-live="polite"></div>

  <aside class="utility-panel" aria-label="Utilities">
    <div class="utility-titlebar">
      <span>Utilities</span>
      <span class="utility-status">●</span>
    </div>
    <button class="utility-item" data-open-app="files">
      <span class="utility-icon">▱</span><span>File Manager</span>
    </button>
    <button class="utility-item" data-open-app="notes">
      <span class="utility-icon">N</span><span>Text Editor</span>
    </button>
    <button class="utility-item" data-open-app="terminal">
      <span class="utility-icon">&gt;_</span><span>Terminal</span>
    </button>
    <button class="utility-item" data-open-app="system">
      <span class="utility-icon">◫</span><span>System Info</span>
    </button>
    <button class="utility-item" data-open-app="settings">
      <span class="utility-icon">⚙</span><span>Settings</span>
    </button>
    <div class="utility-monitor">
      <div class="monitor-label">System</div>
      <div class="meter"><span style="width:38%"></span></div>
      <div class="meter"><span style="width:61%"></span></div>
      <div class="meter"><span style="width:22%"></span></div>
    </div>
  </aside>

  <div id="launcher" class="launcher hidden" role="menu" aria-label="Applications">
    <div class="launcher-head">
      <div class="launcher-logo">A</div>
      <div>
        <div class="launcher-title">Alpy Web</div>
        <div class="launcher-sub">Portable workspace</div>
      </div>
    </div>
    <input id="launcherSearch" class="launcher-search" placeholder="Find an application…" autocomplete="off">
    <div id="launcherApps" class="launcher-apps"></div>
    <div class="launcher-foot">
      <button class="launcher-foot-btn" data-action="settings">Settings</button>
      <button class="launcher-foot-btn" data-action="lock">Lock</button>
    </div>
  </div>

  <div class="taskbar">
    <button id="menuButton" class="start-button" aria-label="Open Alpy menu">
      <span class="start-mark">A</span>
      <span>Launch</span>
    </button>
    <div id="runningApps" class="running-apps"></div>
    <div class="taskbar-spacer"></div>
    <div class="tray">
      <span class="tray-dot"></span>
      <button id="clock" class="clock" title="Clock"></button>
    </div>
  </div>
</div>

<script src="app.js"></script>
<script>
document.querySelectorAll('[data-open-app]').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const id=btn.dataset.openApp;
    const launcherBtn=document.querySelector('.launcher-app[data-app="'+id+'"]');
    if(launcherBtn) launcherBtn.click();
  });
});
</script>
</body>
</html>
